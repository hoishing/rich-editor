app:
  commands:
    - name: save
      description: Save
      key: ctrl+s
    - name: quit_check
      description: Quit
      key: ctrl+q
    - name: close_buffer
      description: Close buffer
      key: ctrl+w
    - name: open_file_menu
      description: File menu
      key: f10
    - name: open_keybindings
      description: Keybindings
      key: ctrl+k
    - name: toggle_file_tree
      description: Toggle file tree
      key: cmd+b,super+b
    - name: toggle_file_tree_focus
      description: Toggle file tree focus
      key: cmd+shift+e,shift+cmd+e,super+shift+e,shift+super+e

editor:
  - key: alt+up
    action: move_line_up
    description: Move line up
    show: false
  - key: alt+down
    action: move_line_down
    description: Move line down
    show: false
  - key: shift+alt+up
    action: copy_line_up
    description: Copy line up
    show: false
  - key: shift+alt+down
    action: copy_line_down
    description: Copy line down
    show: false
  - key: alt+backspace
    action: delete_word_left
    description: Delete word left
    show: false
  - key: alt+shift+left,shift+alt+left
    action: cursor_word_left(True)
    description: Select word left
    show: false
  - key: alt+shift+right,shift+alt+right
    action: cursor_word_right(True)
    description: Select word right
    show: false
  - key: super+l,cmd+l
    action: select_line
    description: Select line
    show: false
  - key: shift+super+left,super+shift+left,shift+cmd+left,cmd+shift+left
    action: cursor_line_start(True)
    description: Select to line start
    show: false
  - key: shift+super+right,super+shift+right,shift+cmd+right,cmd+shift+right
    action: cursor_line_end(True)
    description: Select to line end
    show: false

screens:
  file_menu:
    - key: escape
      action: dismiss_none
      description: Close
  unsaved_changes:
    - key: escape
      action: cancel
      description: Cancel
  keybindings:
    - key: escape
      action: close
      description: Close
    - key: r
      action: reset
      description: Reset

key_capture:
  cancel_key: escape
