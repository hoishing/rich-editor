app:
  commands:
    - name: save
      description: Save
      key: ctrl+s
    - name: quit_check
      description: Quit
      key: ctrl+q
    - name: close_buffer
      description: Close buffer
      key: ctrl+w
    - name: show_keys_popup
      description: Key bindings
      key: f1
    - name: toggle_file_tree
      description: Toggle file tree
      key: cmd+b,super+b
    - name: quick_open
      description: Quick open
      key: cmd+p,super+p

editor:
  - key: alt+up
    action: move_line_up
    description: Move line up
    show: false
  - key: alt+down
    action: move_line_down
    description: Move line down
    show: false
  - key: alt+shift+up,shift+alt+up
    action: copy_line_up
    description: Copy line up
    show: false
  - key: alt+shift+down,shift+alt+down
    action: copy_line_down
    description: Copy line down
    show: false
  - key: alt+backspace
    action: delete_word_left
    description: Delete word left
    show: false
  - key: alt+shift+left,shift+alt+left
    action: cursor_word_left(True)
    description: Select word left
    show: false
  - key: alt+shift+right,shift+alt+right
    action: cursor_word_right(True)
    description: Select word right
    show: false
  - key: super+l,cmd+l
    action: select_line
    description: Select line
    show: false
  - key: cmd+shift+k,shift+cmd+k,super+shift+k,shift+super+k
    action: delete_line
    description: Delete line
  - key: ctrl+shift+k,shift+ctrl+k
    action: ignore
    description: Ignore inherited delete line
    show: false
    help: false
  - key: shift+super+left,super+shift+left,shift+cmd+left,cmd+shift+left
    action: cursor_line_start(True)
    description: Select to line start
    show: false
  - key: shift+super+right,super+shift+right,shift+cmd+right,cmd+shift+right
    action: cursor_line_end(True)
    description: Select to line end
    show: false

screens:
  unsaved_changes:
    - key: escape
      action: cancel
      description: Cancel
  quick_open:
    - key: escape
      action: close
      description: Close
  keys_help:
    - key: escape
      action: close
      description: Close
