app:
  commands:
    - name: save
      description: Save
      key: cmd+s,super+s
    - name: command_palette
      description: Command palette
      key: f1
      display_keys:
        - f1
    - name: toggle_sidebar
      description: Toggle sidebar
      key: cmd+b,super+b,ctrl+b
      display_keys:
        - cmd+b
        - ctrl+b
      ghostty_display_keys:
        - ctrl+b
    - name: quick_open
      description: Quick open
      key: cmd+p,super+p,ctrl+p
      display_keys:
        - cmd+p
        - ctrl+p
      ghostty_display_keys:
        - ctrl+p
    - name: replace
      description: Replace
      key: ctrl+h
    - name: create_file
      description: Create file
      key: ctrl+n
      preferred_key: ctrl+n
    - name: toggle_markdown_preview
      description: Toggle Markdown preview
      key: ctrl+shift+v,shift+ctrl+v,ctrl+V,alt+shift+v,shift+alt+v,alt+shift+V,shift+alt+V,alt+v
      preferred_key: ctrl+shift+v
      display_keys:
        - ctrl+shift+v
      wezterm_display_keys:
        - ctrl+shift+v
        - alt+shift+v
    - name: format_document
      description: Format document
      key: alt+shift+f,shift+alt+f,alt+shift+F,shift+alt+F,alt+F
      preferred_key: alt+shift+f,shift+alt+f
    - name: refresh_workspace
      description: Refresh
      key: cmd+r,super+r

editor:
  - key: alt+up
    action: move_line_up
    description: Move line up
    show: false
  - key: alt+down
    action: move_line_down
    description: Move line down
    show: false
  - key: alt+shift+up,shift+alt+up
    action: copy_line_up
    description: Copy line up
    show: false
  - key: alt+shift+down,shift+alt+down
    action: copy_line_down
    description: Copy line down
    show: false
  - key: cmd+enter,super+enter
    preferred_key: cmd+enter,super+enter
    action: insert_line_below
    description: Insert line below
    show: false
  - key: cmd+shift+enter,shift+cmd+enter,super+shift+enter,shift+super+enter
    preferred_key: cmd+shift+enter,shift+cmd+enter,super+shift+enter,shift+super+enter
    action: insert_line_above
    description: Insert line above
    show: false
  - key: cmd+],super+],cmd+right_square_bracket,super+right_square_bracket
    preferred_key: cmd+],super+]
    action: indent_line
    description: Indent line
    show: false
  - key: cmd+[,super+[,cmd+left_square_bracket,super+left_square_bracket
    preferred_key: cmd+[,super+[
    action: outdent_line
    description: Outdent line
    show: false
  - key: alt+backspace
    action: delete_word_left
    description: Delete word left
    show: false
  - key: cmd+backspace,super+backspace,ctrl+u
    action: delete_to_start_of_line_or_delete_left
    description: Delete to line start
    show: false
  - key: cmd+z,super+z
    preferred_key: cmd+z,super+z
    action: undo
    description: Undo
    show: false
  - key: cmd+shift+z,shift+cmd+z,super+shift+z,shift+super+z,cmd+Z,shift+cmd+Z,super+Z,shift+super+Z,cmd+shift+Z,super+shift+Z
    preferred_key: cmd+shift+z,shift+cmd+z,super+shift+z,shift+super+z
    action: redo
    description: Redo
    show: false
  - key: cmd+x,super+x
    action: cut
    description: Cut
    show: false
  - key: cmd+/,super+/,cmd+slash,super+slash
    action: toggle_line_comment
    description: Toggle line comment
    show: false
  - key: alt+z
    action: toggle_word_wrap
    description: Toggle word wrap
    show: false
  - key: alt+shift+left,shift+alt+left
    action: cursor_word_left(True)
    description: Select word left
    show: false
  - key: alt+shift+right,shift+alt+right
    action: cursor_word_right(True)
    description: Select word right
    show: false
  - key: super+l,cmd+l
    action: select_line
    description: Select line
    show: false
  - key: cmd+shift+k,shift+cmd+k,super+shift+k,shift+super+k,cmd+K,shift+cmd+K,super+K,shift+super+K,cmd+shift+K,super+shift+K
    action: delete_line
    description: Delete line
  - key: ctrl+shift+k,shift+ctrl+k
    action: ignore
    description: Ignore inherited delete line
    show: false
    help: false
  - key: shift+super+left,super+shift+left,shift+cmd+left,cmd+shift+left
    action: cursor_line_start(True)
    description: Select to line start
    show: false
  - key: shift+super+right,super+shift+right,shift+cmd+right,cmd+shift+right
    action: cursor_line_end(True)
    description: Select to line end
    show: false

sidebar:
  - key: cmd+backspace,super+backspace,ctrl+u
    action: trash_selected
    description: Move to Trash
    show: false

screens:
  quit_confirmation:
    - key: escape
      action: cancel
      description: Cancel
  unsaved_changes:
    - key: escape
      action: cancel
      description: Cancel
  rename_path:
    - key: escape
      action: cancel
      description: Cancel
  trash_path_confirmation:
    - key: escape
      action: cancel
      description: Cancel
  quick_open:
    - key: escape
      action: close
      description: Close
  replace:
    - key: escape
      action: close
      description: Close
  create_file:
    - key: escape
      action: close
      description: Close
  keys_help:
    - key: escape
      action: close
      description: Close
