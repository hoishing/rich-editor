[project]
name = "riched"
version = "1.5.0"
description = "Terminal Editor with VS Code Keybindings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.3",
  "textual[syntax]>=8.2.4",
  "trash-cli>=0.24.5.26",
  "tree-sitter-make>=1.1.1",
  "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
dockerfile = ["tree-sitter-dockerfile>=0.2.0"]

[project.urls]
Repository = "https://github.com/hoishing/riched"

[project.scripts]
riched = "rich_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rich_editor"]

[dependency-groups]
dev = ["basedpyright>=1.39.3", "ruff>=0.15.12"]
