[project]
name = "rich-editor"
version = "1.1.0"
description = "A Rich library powered editor that implements VS Code keybindings in TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.3",
  "textual[syntax]>=8.2.4",
  "trash-cli>=0.24.5.26",
  "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Repository = "https://github.com/hoishing/rich-editor"

[project.scripts]
rich = "rich_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rich_editor"]

[dependency-groups]
dev = ["basedpyright>=1.39.3", "ruff>=0.15.12"]
