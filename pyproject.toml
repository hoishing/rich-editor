[project]
name = "riched"
version = "0.2.1"
description = "TUI editor with VSCode keybindigs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "textual[syntax]>=8.2.4",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
riched = "riched.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riched"]
