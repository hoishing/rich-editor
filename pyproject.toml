[project]
name = "riched"
version = "0.6.4"
description = "A Rich library powered editor(hence the name riched) that implements VS Code keybindings in TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "textual[syntax]>=8.2.4",
    "tree-sitter-typescript>=0.23.2",
]

[project.urls]
Repository = "https://github.com/hoishing/riched"

[project.scripts]
riched = "riched.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riched"]
